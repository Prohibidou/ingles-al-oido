<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Creador</title>
<style>
  :root { --ground: #f4f6f1; --ink-2: #576169; --ink-3: #8a938d; --line: #dfe3db; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #0e1111; --ink-2: #9aa39d; --ink-3: #6f7873; --line: #272d2b; }
  }
  :root[data-fondo="bauhaus"] { --ground: #f4f1ea; --ink-2: #55524c; --ink-3: #87837b; --line: #dcd6ca; }
  @media (prefers-color-scheme: dark) {
    :root[data-fondo="bauhaus"] { --ground: #121212; --ink-2: #a9a59d; --ink-3: #7a766f; --line: #2c2c2c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink-2);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 16px; min-height: 100dvh;
  }
  img {
    display: block; width: min(92vw, 78vh, 640px); height: auto; aspect-ratio: 1; object-fit: cover;
    border-radius: 22px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
  }
  footer { display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 12.5px; color: var(--ink-3); text-align: center; }
  footer::before { content: ""; width: 32px; height: 1px; background: var(--line); margin-bottom: 10px; }
  a { color: inherit; text-underline-offset: 2px; text-decoration-color: var(--line); padding: 4px 6px; }
  a:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 2px; border-radius: 6px; }
</style>
</head>
<body>
<img src="creador.jpg" alt="Foto del creador" width="640" height="640">
<footer>
  <span>built by @prohibidou</span>
  <a href="https://wa.me/5492975018593" target="_blank" rel="noopener">WhatsApp 297 501 8593</a>
</footer>
</body>
</html>
